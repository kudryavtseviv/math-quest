<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212; --surface: #1e1e1e; --primary: #00ffcc;
            --primary-hover: #00cca3; --text: #ffffff; --text-secondary: #aaaaaa;
            --danger: #ff4757; --success: #2ed573;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
        
        #app { width: 100%; max-width: 500px; padding: 20px; position: relative; display: flex; flex-direction: column; }
        .screen { display: none; flex-direction: column; flex-grow: 1; }
        .screen.active { display: flex; }
        
        h1, h2 { text-align: center; margin-bottom: 20px; font-weight: 800; }
        h1 { font-size: 28px; color: var(--primary); margin-top: 20px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        button { 
            background: var(--surface); color: var(--text); border: 2px solid transparent; 
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 600; 
            cursor: pointer; transition: 0.2s; 
        }
        button:active { transform: scale(0.98); }
        .btn-grade { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-grade:hover, .btn-diff:hover { border-color: var(--primary); }
        
        .btn-primary { background: var(--primary); color: #000; border: none; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 2px solid var(--text-secondary); width: 100%; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .timer { font-size: 24px; font-weight: 800; color: var(--primary); }
        .timer.warning { color: var(--danger); }
        
        .question-counter { text-align: center; color: var(--text-secondary); margin-bottom: 10px; font-size: 14px; }
        .question-box { background: var(--surface); padding: 20px; border-radius: 12px; margin-bottom: 20px; font-size: 18px; line-height: 1.5; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; flex-grow: 1; }
        .option-btn { background: var(--surface); border: 2px solid #333; text-align: left; }
        .option-btn.selected { border-color: var(--primary); background: rgba(0, 255, 204, 0.1); }
        
        .nav-buttons { display: flex; gap: 10px; margin-top: auto; }
        .nav-buttons button { flex: 1; }
        
        .result-huge { font-size: 64px; text-align: center; font-weight: 800; color: var(--primary); margin: 20px 0; }
        
        .floating-btn { 
            position: fixed; bottom: 20px; right: 20px; background: var(--surface); 
            border: 2px solid var(--primary); color: var(--primary); border-radius: 50%; 
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; 
            font-size: 20px; z-index: 100;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Екран 1: Вибір класу -->
    <div id="screen-grade" class="screen active">
        <h1>MATH QUEST</h1>
        <p style="text-align: center; margin-bottom: 20px; color: var(--text-secondary);">Обери останній закінчений клас</p>
        <div class="grid">
            <button class="btn-grade" onclick="setGrade(4)">4 клас</button>
            <button class="btn-grade" onclick="setGrade(5)">5 клас</button>
            <button class="btn-grade" onclick="setGrade(6)">6 клас</button>
            <button class="btn-grade" onclick="setGrade(7)">7 клас</button>
            <button class="btn-grade" onclick="setGrade(8)">8 клас</button>
            <button class="btn-grade" onclick="setGrade(9)">9 клас</button>
            <button class="btn-grade" onclick="setGrade(10)">10 клас</button>
            <button class="btn-grade" onclick="setGrade(11)">11 клас</button>
        </div>
    </div>

    <!-- Екран 2: Вибір складності -->
    <div id="screen-diff" class="screen">
        <h2>Обери складність</h2>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
            <button class="btn-diff" onclick="setDifficulty('easy')">🟢 Легкий (Макс. 6 балів)</button>
            <button class="btn-diff" onclick="setDifficulty('medium')">🟡 Середній (Макс. 8 балів)</button>
            <button class="btn-diff" onclick="setDifficulty('hard')">🔴 Складний (Макс. 10 балів)</button>
        </div>
        <button class="btn-outline" style="margin-top: auto;" onclick="navTo('screen-grade')">← Назад</button>
    </div>

    <!-- Екран 3: Готовність -->
    <div id="screen-ready" class="screen">
        <h2>ПІДГОТОВКА</h2>
        <div class="question-box" style="text-align: center;">
            <p style="margin-bottom: 10px; color: var(--text-secondary);">Клас: <strong id="ready-grade" style="color: var(--text);"></strong></p>
            <p style="margin-bottom: 10px; color: var(--text-secondary);">Складність: <strong id="ready-diff" style="color: var(--text);"></strong></p>
            <p style="margin-bottom: 10px; color: var(--text-secondary);">Завдань: <strong id="ready-count" style="color: var(--text);"></strong></p>
            <p style="margin-bottom: 10px; color: var(--text-secondary);">Час: <strong style="color: var(--text);">2 хвилини</strong></p>
            <hr style="border-color: #333; margin: 15px 0;">
            <p style="font-size: 14px;">Ти можеш пропускати завдання і повертатися до них. Таймер спільний для всіх завдань.</p>
        </div>
        <div class="nav-buttons">
            <button class="btn-outline" onclick="navTo('screen-diff')">Назад</button>
            <button class="btn-primary" onclick="startQuiz()">ПОЧАТИ</button>
        </div>
    </div>

    <!-- Екран 4: Завдання -->
    <div id="screen-task" class="screen">
        <div class="header-bar">
            <div id="task-badge" style="background: var(--surface); padding: 5px 12px; border-radius: 8px; font-weight: 600;"></div>
            <div id="timer" class="timer">02:00</div>
        </div>
        <div class="question-counter" id="q-counter">Питання 1 з 5</div>
        <div class="question-box" id="question-text">Завантаження...</div>
        
        <div class="options-list" id="options-area"></div>

        <div class="nav-buttons">
            <button class="btn-outline" id="btn-prev" onclick="changeQuestion(-1)">← Попереднє</button>
            <button class="btn-primary" id="btn-next" onclick="changeQuestion(1)">Наступне →</button>
        </div>
        <button class="btn-primary" id="btn-finish" style="display: none; margin-top: 10px; background: var(--success);" onclick="finishQuiz()">Завершити тест</button>
    </div>

    <!-- Екран 5: Результат -->
    <div id="screen-result" class="screen">
        <h2>РЕЗУЛЬТАТ</h2>
        <div id="result-stats" style="text-align: center; color: var(--text-secondary);"></div>
        <div id="result-score" class="result-huge">0</div>
        <p style="text-align: center; font-weight: 600; margin-bottom: 5px;">БАЛІВ</p>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 14px;">Покажи цей екран адміністратору</p>
        <button class="btn-primary" style="margin-top: auto;" onclick="resetApp()">На головну</button>
    </div>
    
    <button class="floating-btn" id="btn-formula" onclick="alert('У розробці')" style="display: none;">ƒ</button>
</div>

<script>
/* =========================================
   КОНФІГУРАЦІЯ
   ========================================= */
const CONFIG = {
    totalTime: 120, // 2 хвилини на всі завдання (в секундах)
    maxPoints: { easy: 6, medium: 8, hard: 10 },
    questionsCount: { easy: 5, medium: 4, hard: 3 } // Скільки питань дається на кожному рівні
};

const diffLabels = { easy: "Легкий", medium: "Середній", hard: "Складний" };

/* =========================================
   БАЗА ЗАВДАНЬ (Мінімум необхідна кількість для кожного класу/рівня)
   ========================================= */
const TASKS = {
    4: {
        easy: [
            { q: "Обчисли: 150 + 250", options: ["300", "400", "350", "450"], ans: 1 },

        ],

            { q: "Знайди площу прямокутника 4 см на 7 см.", options: ["22 см²", "11 см²", "28 см²", "24 см²"], ans: 2 },

        ],

            { q: "У трьох класах 90 учнів. У першому 32, у другому 28. Скільки у третьому?", options: ["30", "28", "32", "26"], ans: 0 },

    },
    5: {

            { q: "2.5 + 1.5 = ?", options: ["3", "4.5", "4", "3.5"], ans: 2 },

            { q: "Який дріб більший: 1/2 чи 1/3?", options: ["1/2", "1/3", "Рівні", "Неможливо визначити"], ans: 0 },
            { q: "Середнє арифметичне 4 і 8.", options: ["5", "6", "7", "12"], ans: 1 },

            { q: "В класі 30 учнів, 20% - відмінники. Скільки відмінників?", options: ["5", "6", "8", "4"], ans: 1 },

        easy: [
            { q: "-15 + 8 = ?", options: ["-7", "-23", "7", "23"], ans: 0 },

    7: {
        easy: [
            { q: "Спрости: x³ * x⁴", options: ["x^12", "x^7", "2x^7", "x"], ans: 1 },

    },
    8: {
        easy: [
            { q: "√64 - √25 = ?", options: ["3", "13", "-3", "8"], ans: 0 },
            { q: "Гіпотенуза 10, катет 6. Інший катет?", options: ["4", "8", "16", "64"], ans: 1 },
            { q: "Спрости: 2x(x - 3) - 2x²", options: ["-6x", "6x", "-3x", "-6"], ans: 0 },
            { q: "√x = 9, x = ?", options: ["3", "18", "81", "27"], ans: 2 },
            { q: "Площа квадрата 49 см². Сторона?", options: ["14", "7", "24.5", "9"], ans: 1 }
        ],
        medium: [
            { q: "(x-2)/3 = (x+1)/4. x = ?", options: ["5", "11", "-11", "2"], ans: 1 },
            { q: "Площа прямокутника 48, сторона 6. Периметр?", options: ["28", "14", "54", "48"], ans: 0 },
            { q: "(√5 - √2)(√5 + √2) = ?", options: ["7", "√3", "3", "21"], ans: 2 },
            { q: "x² - 9 = 0. Корені?", options: ["3", "9", "-3 і 3", "немає"], ans: 2 }
        ],
        hard: [
            { q: "Більший корінь: x² - 5x + 6 = 0", options: ["2", "3", "6", "-1"], ans: 1 },
            { q: "Діагоналі ромба 10 і 24. Сторона ромба?", options: ["17", "13", "12", "26"], ans: 1 },
            { q: "Спрости (a²-9)/(a+3) при a=15", options: ["12", "15", "18", "8"], ans: 0 }

        easy: [

        easy: [
            { q: "log₂ 8 = ?", options: ["4", "3", "16", "6"], ans: 1 },
            { q: "Похідна f(x) = x³ + 5x", options: ["3x² + 5", "3x²", "x² + 5", "x⁴/4"], ans: 0 },

            { q: "Первісна для f(x) = 2x", options: ["2", "x² + C", "x²", "2x² + C"], ans: 1 }

    }
};

/* =========================================
   ЛОГІКА ЗАСТОСУНКУ
   ========================================= */

let state = {
    grade: null, diff: null, 
    questions: [], answers: [], 
    currentIndex: 0, timeLeft: 0, timerId: null
};

// Перевіряємо, чи є збережена сесія (щоб не вибивало при випадковому згортанні)
window.onload = () => {
    const saved = sessionStorage.getItem('mathQuestSession');
    if (saved) {
        state = JSON.parse(saved);
        if (state.timeLeft > 0 && state.questions.length > 0 && state.answers.length !== state.questions.length + 1) { // +1 як флаг завершення
            renderTaskView();
            startTimer();
            return;
        }
    }
    navTo('screen-grade');
};

function saveState() {
    sessionStorage.setItem('mathQuestSession', JSON.stringify(state));
}

function navTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function setGrade(g) {
    state.grade = g;
    navTo('screen-diff');
}

function setDifficulty(d) {
    state.diff = d;
    document.getElementById('ready-grade').innerText = state.grade + ' клас';
    document.getElementById('ready-diff').innerText = diffLabels[d];
    document.getElementById('ready-count').innerText = CONFIG.questionsCount[d];
    navTo('screen-ready');
}

function startQuiz() {
    const pool = TASKS[state.grade][state.diff];
    const count = CONFIG.questionsCount[state.diff];
    
    // Перемішуємо пул і беремо потрібну кількість
    let shuffled = [...pool].sort(() => 0.5 - Math.random());
    state.questions = shuffled.slice(0, count);
    state.answers = new Array(count).fill(null);
    state.currentIndex = 0;
    state.timeLeft = CONFIG.totalTime;
    
    renderTaskView();
    startTimer();
}

function renderTaskView() {
    navTo('screen-task');
    saveState();
    
    document.getElementById('task-badge').innerText = `${state.grade} клас • ${diffLabels[state.diff]}`;
    document.getElementById('q-counter').innerText = `Питання ${state.currentIndex + 1} з ${state.questions.length}`;
    
    const task = state.questions[state.currentIndex];
    document.getElementById('question-text').innerText = task.q;
    
    const optsArea = document.getElementById('options-area');
    optsArea.innerHTML = '';
    
    const letters = ["А", "Б", "В", "Г"];
    task.options.forEach((opt, idx) => {
        let isSelected = state.answers[state.currentIndex] === idx ? 'selected' : '';
        optsArea.innerHTML += `<button class="option-btn ${isSelected}" onclick="selectOpt(${idx})"><b>${letters[idx]})</b> ${opt}</button>`;
    });

    document.getElementById('btn-prev').disabled = state.currentIndex === 0;
    
    // Якщо останнє питання - міняємо кнопку "Наступне" на "Завершити"
    if (state.currentIndex === state.questions.length - 1) {
        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('btn-finish').style.display = 'block';
    } else {
        document.getElementById('btn-next').style.display = 'block';
        document.getElementById('btn-finish').style.display = 'none';
    }
}

function selectOpt(idx) {
    state.answers[state.currentIndex] = idx;
    saveState();
    renderTaskView(); // перемальовуємо, щоб підсвітити обраний
}

function changeQuestion(step) {
    state.currentIndex += step;
    renderTaskView();
}

function startTimer() {
    clearInterval(state.timerId);
    updateTimerUI();
    state.timerId = setInterval(() => {
        state.timeLeft--;
        saveState();
        updateTimerUI();
        if (state.timeLeft <= 0) {
            finishQuiz(true); // true = закінчився час
        }
    }, 1000);
}

function updateTimerUI() {
    const t = document.getElementById('timer');
    const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
    const s = (state.timeLeft % 60).toString().padStart(2, '0');
    t.innerText = `${m}:${s}`;
    if (state.timeLeft <= 15) t.classList.add('warning');
    else t.classList.remove('warning');
}

function finishQuiz(timeOut = false) {
    clearInterval(state.timerId);
    
    // Рахуємо правильні
    let correct = 0;
    for (let i = 0; i < state.questions.length; i++) {
        if (state.answers[i] === state.questions[i].ans) correct++;
    }
    
    // Формула: (Правильні / Всього) * Макс.Бал
    const maxScore = CONFIG.maxPoints[state.diff];
    const finalScore = Math.round((correct / state.questions.length) * maxScore);
    
    sessionStorage.removeItem('mathQuestSession'); // Очищаємо сесію
    
    document.getElementById('result-stats').innerText = `Правильно: ${correct} з ${state.questions.length}${timeOut ? ' (Час вийшов)' : ''}`;
    document.getElementById('result-score').innerText = finalScore;
    
    navTo('screen-result');
}

function resetApp() {
    state = { grade: null, diff: null, questions: [], answers: [], currentIndex: 0, timeLeft: 0, timerId: null };
    navTo('screen-grade');
}
</script>
